name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - NOMBRE=MAFER
      - APELLIDO=PONT
      - DOCUMENTO=555555
      - NACIMIENTO=1999-03-17
      - NUMERO=7578
    networks:
    - testing_net
    depends_on:
    - server
    volumes:
      - ./client/config.yaml:/config.yaml

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
