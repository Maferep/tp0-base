name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
    - TOTAL_CLIENTS=5
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    volumes:
      - dataset:/var/lib/client/data
      - ./client/config.yaml:/config.yaml
    image: client:latest
    entrypoint: /client
    environment:
    - CLI_ID=1
    - CLI_LOG_LEVEL=DEBUG
    networks:
    - testing_net
    depends_on:
    - server
  client2:
    container_name: client2
    volumes:
      - dataset:/var/lib/client/data
      - ./client/config.yaml:/config.yaml
    image: client:latest
    entrypoint: /client
    environment:
    - CLI_ID=2
    - CLI_LOG_LEVEL=DEBUG
    networks:
    - testing_net
    depends_on:
    - server
  client3:
    container_name: client3
    volumes:
      - dataset:/var/lib/client/data
      - ./client/config.yaml:/config.yaml
    image: client:latest
    entrypoint: /client
    environment:
    - CLI_ID=3
    - CLI_LOG_LEVEL=DEBUG
    networks:
    - testing_net
    depends_on:
    - server
  client4:
    container_name: client4
    volumes:
      - dataset:/var/lib/client/data
      - ./client/config.yaml:/config.yaml
    image: client:latest
    entrypoint: /client
    environment:
    - CLI_ID=4
    - CLI_LOG_LEVEL=DEBUG
    networks:
    - testing_net
    depends_on:
    - server
  client5:
    container_name: client5
    volumes:
      - dataset:/var/lib/client/data
      - ./client/config.yaml:/config.yaml
    image: client:latest
    entrypoint: /client
    environment:
    - CLI_ID=5
    - CLI_LOG_LEVEL=DEBUG
    networks:
    - testing_net
    depends_on:
    - server

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
volumes:
  dataset:
    driver: local
    driver_opts:
      type: none
      o: bind 
      device: ./.data
